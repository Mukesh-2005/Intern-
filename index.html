<!DOCTYPE html>
<link rel="stylesheet" href="style.css">
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Star Mukesh — Personal Page</title>
</head>
<body>

  <!-- HEADER: top section of the page, usually logo/name + nav -->
  <header>
    <h1>Star Mukesh</h1>
    <p>Frontend Developer Intern</p>
  </header>

  <!-- NAV: navigation links. The # links jump to sections with matching id -->
  <nav>
    <a href="#about">About</a> |
    <a href="#contact">Contact</a>
  </nav>

  <!-- MAIN: wraps the primary content of the page (only one per page) -->
  <main>

    <!-- SECTION: a distinct block of related content, here "About" -->
    <section id="about">
      <h2>About Me</h2>
      <p>
        I'm a final-year Data Science student currently learning frontend
        development as part of my internship at Conceptra Labs.
      </p>

      <!-- IMG: always needs src (image path/URL) and alt (text if image fails to load) -->
      <img src="https://via.placeholder.com/150" alt="Placeholder profile photo" width="150">
    </section>

    <!-- SECTION: a second distinct block, here "Contact" -->
    <section id="contact">
      <h2>Contact Me</h2>

      <!-- FORM: collects user input. action/method matter later once there's a backend -->
      <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Your name"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="your@email.com"><br><br>

        <button type="submit">Send</button>
      </form>
    </section>

  </main>

  <!-- FOOTER: bottom of the page, usually copyright/links -->
  <footer>
    <p>&copy; 2026 Star Mukesh. All rights reserved.</p>
  </footer>

</body>
</html>
